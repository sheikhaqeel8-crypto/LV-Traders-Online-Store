<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LV Traders - Wholesale Store</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding-top: 120px; padding-bottom: 75px; }

    .header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: linear-gradient(135deg, #4a0e4e 0%, #880e4f 50%, #c62828 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #fff; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .admin-btn, .logout-btn {
      background: rgba(0,0,0,0.3); border: 1px solid #ff8a80; color: #fff;
      padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .bill-box {
      background: rgba(0,0,0,0.3); padding: 5px 10px; border-radius: 8px;
      border: 1px solid #ff5252; text-align: right;
    }
    .bill-amount { font-size: 15px; font-weight: bold; color: #ffeb3b; }
    .pkt-count { font-size: 11px; color: #ffcdd2; }

    .categories {
      display: flex; overflow-x: auto; gap: 8px; padding: 10px 14px;
      background: #380b3d; scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #512da8; color: #fff; border: 1px solid #ad1457;
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active {
      background: linear-gradient(90deg, #d32f2f, #ad1457);
      border-color: #ff8a80; box-shadow: 0 2px 8px rgba(211,47,47,0.4);
    }

    .container { max-width: 500px; margin: 0 auto; padding: 0 10px; }

    .auth-card {
      background: #ffffff; border: 2px solid #880e4f; padding: 24px;
      border-radius: 16px; margin-top: 30px; text-align: center; color: #333;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    .auth-card h2 { color: #880e4f; margin-bottom: 8px; font-size: 20px; }
    .auth-card p { font-size: 13px; color: #666; margin-bottom: 20px; }
    .input-field {
      width: 100%; padding: 12px; margin-bottom: 12px; background: #fafafa;
      border: 1px solid #ccc; color: #333; border-radius: 8px; font-size: 14px;
    }
    .primary-btn {
      width: 100%; padding: 12px; background: linear-gradient(90deg, #c62828, #6a1b9a);
      border: none; color: #fff; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px;
    }

    .product-item {
      background: #ffffff; margin-bottom: 20px; border-radius: 12px;
      overflow: hidden; border: 1px solid #e0e0e0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .product-img {
      width: 100%; height: 62vh; object-fit: contain; display: block; background: #f9f9f9;
    }
    .product-info { padding: 14px; background: #ffffff; }
    .product-cat {
      display: inline-block; background: #fce4ec; color: #880e4f;
      font-size: 10px; padding: 3px 8px; border-radius: 4px; margin-bottom: 4px; font-weight: bold;
    }
    .product-title { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 2px; }
    .product-desc { font-size: 13px; color: #666; margin-bottom: 12px; }

    .price-cart-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #fdf2f2; padding: 10px 12px; border-radius: 10px;
      border: 1px solid #ffcdd2;
    }
    .price-label { font-size: 11px; color: #d32f2f; }
    .price-val { font-size: 18px; font-weight: 800; color: #c62828; }

    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 38px; height: 38px; border-radius: 8px; border: none;
      font-size: 20px; font-weight: bold; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-minus { background: #6a1b9a; }
    .btn-plus { background: linear-gradient(135deg, #d32f2f, #ad1457); }
    .qty-display { font-size: 15px; font-weight: bold; min-width: 50px; text-align: center; color: #333; }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 14px;
      background: #ffffff; border-top: 1px solid #ddd; z-index: 1000; display: flex; gap: 10px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
    }
    .wa-btn {
      flex: 1; background: linear-gradient(90deg, #2e7d32, #1b5e20); color: #fff;
      border: none; padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
    }

    .admin-panel { background: #ffffff; padding: 15px; border-radius: 12px; margin-top: 10px; color: #333; border: 1px solid #ddd; }
    .admin-section { background: #f9f9f9; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #e0e0e0; }
    .admin-section h3 { font-size: 15px; color: #880e4f; margin-bottom: 10px; }
    .user-row, .bulk-preview-row, .admin-prod-row {
      background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee;
    }
    .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-remove { background: #c62828; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="brand">LV TRADERS</div>
      <div class="header-actions">
        <button class="admin-btn" onclick="toggleAdminPanel()">⚙️ Admin</button>
        <button class="logout-btn" onclick="logoutUser()" id="logoutBtn" style="display:none;">Logout</button>
      </div>
      <div class="bill-box">
        <div class="bill-amount">Bill: Rs. <span id="totalBill">0</span></div>
        <div class="pkt-count">Cart: <span id="totalPkts">0</span> Pkts</div>
      </div>
    </div>
    <div class="categories" id="categoryBar" style="display:none;">
      <button class="cat-btn active" onclick="filterProducts('All', this)">All Items</button>
      <button class="cat-btn" onclick="filterProducts('Hats', this)">Hats</button>
      <button class="cat-btn" onclick="filterProducts('Socks', this)">Socks</button>
      <button class="cat-btn" onclick="filterProducts('Turbans', this)">Turbans</button>
      <button class="cat-btn" onclick="filterProducts('Warmer Suits', this)">Warmer Suits</button>
      <button class="cat-btn" onclick="filterProducts('Mufflers', this)">Mufflers</button>
      <button class="cat-btn" onclick="filterProducts('Trousers', this)">Trousers</button>
    </div>
  </div>

  <div class="container" id="mainContainer"></div>

  <div class="bottom-bar" id="bottomBar" style="display:none;">
    <button class="wa-btn" onclick="generatePDFAndWhatsApp()">📲 Send PDF Bill to WhatsApp</button>
  </div>

  <script>
    let currentUser = null;
    try {
      currentUser = JSON.parse(localStorage.getItem('lv_user')) || null;
    } catch(e) { currentUser = null; }

    let isAdminLoggedIn = localStorage.getItem('lv_admin') === 'true';
    let products = [];
    let customers = [];

    try {
      products = JSON.parse(localStorage.getItem('lv_products')) || [];
      customers = JSON.parse(localStorage.getItem('lv_customers')) || [];
    } catch(e) {
      products = [];
      customers = [];
    }

    let currentCategory = 'All';
    let tempBulkImages = [];

    // فوری رینڈر
    renderApp();

    function renderApp() {
      const container = document.getElementById('mainContainer');
      const bottomBar = document.getElementById('bottomBar');
      const logoutBtn = document.getElementById('logoutBtn');
      const headerCategories = document.getElementById('categoryBar');

      if (!container) return;

      if (isAdminLoggedIn) {
        headerCategories.style.display = 'none';
        bottomBar.style.display = 'none';
        logoutBtn.style.display = 'block';
        renderAdminPanel();
        return;
      }

      if (!currentUser) {
        headerCategories.style.display = 'none';
        bottomBar.style.display = 'none';
        logoutBtn.style.display = 'none';
        container.innerHTML = `
          <div class="auth-card">
            <h2>LV TRADERS - WHOLESALE</h2>
            <p>Please enter your details to request access to the store.</p>
            <input type="text" id="regName" class="input-field" placeholder="Your Name / Owner Name">
            <input type="text" id="regShop" class="input-field" placeholder="Shop Name & City">
            <input type="tel" id="regPhone" class="input-field" placeholder="Mobile / WhatsApp Number">
            <button class="primary-btn" onclick="registerUser()">Request Store Access</button>
          </div>
        `;
        return;
      }

      const activeCust = customers.find(c => c.phone === currentUser.phone);
      if (!activeCust || !activeCust.approved) {
        headerCategories.style.display = 'none';
        bottomBar.style.display = 'none';
        logoutBtn.style.display = 'block';
        container.innerHTML = `
          <div class="auth-card">
            <h2>⏳ Approval Pending</h2>
            <p>Your account is waiting for Admin Approval by LV Traders.</p>
            <button class="primary-btn" onclick="logoutUser()" style="background:#512da8; margin-top:15px;">Switch Account / Logout</button>
          </div>
        `;
        return;
      }

      headerCategories.style.display = 'flex';
      bottomBar.style.display = 'flex';
      logoutBtn.style.display = 'block';
      
      let html = '<div class="feed-container">';
      const filtered = currentCategory === 'All' ? products : products.filter(p => p.category === currentCategory);
      
      if (filtered.length === 0) {
        html += '<div style="text-align:center; padding:50px 20px; color:#666;"><h3>No Products Live Yet</h3><p style="font-size:13px;">Admin has not uploaded any products yet.</p></div>';
      }

      filtered.forEach(p => {
        html += `
          <div class="product-item">
            <img src="${p.img}" class="product-img" alt="${p.name}">
            <div class="product-info">
              <span class="product-cat">${p.category}</span>
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.desc}</div>
              <div class="price-cart-row">
                <div>
                  <div class="price-label">Packet Price</div>
                  <div class="price-val">Rs. ${p.price.toLocaleString()}</div>
                </div>
                <div class="qty-controls">
                  <button class="qty-btn btn-minus" onclick="updateQty(${p.id}, -1)">−</button>
                  <div class="qty-display">${p.qty} Pkt</div>
                  <button class="qty-btn btn-plus" onclick="updateQty(${p.id}, 1)">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
      updateHeaderBill();
    }

    function registerUser() {
      const name = document.getElementById('regName').value.trim();
      const shop = document.getElementById('regShop').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      if (!name || !shop || !phone) { alert("Please fill in all fields!"); return; }

      let existing = customers.find(c => c.phone === phone);
      if (!existing) {
        customers.push({ name, shop, phone, approved: false });
      }

      localStorage.setItem('lv_customers', JSON.stringify(customers));
      currentUser = { name, phone };
      localStorage.setItem('lv_user', JSON.stringify(currentUser));
      alert("Request sent successfully! Waiting for Admin Approval.");
      renderApp();
    }

    function logoutUser() {
      currentUser = null;
      isAdminLoggedIn = false;
      localStorage.removeItem('lv_user');
      localStorage.removeItem('lv_admin');
      renderApp();
    }

    function toggleAdminPanel() {
      if (isAdminLoggedIn) {
        isAdminLoggedIn = false;
        localStorage.removeItem('lv_admin');
        renderApp();
      } else {
        let pass = prompt("Enter Admin Password:");
        if (pass === "admin123") {
          isAdminLoggedIn = true;
          localStorage.setItem('lv_admin', 'true');
          renderApp();
        } else if (pass !== null) {
          alert("Incorrect Password!");
        }
      }
    }

    function renderAdminPanel() {
      const container = document.getElementById('mainContainer');
      if (!container) return;

      let custHtml = '';
      customers.forEach((c, idx) => {
        custHtml += `
          <div class="user-row" style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${c.name}</b> (${c.shop})<br><small>${c.phone}</small></div>
            <div>
              ${c.approved ? '<span style="color:#2e7d32; font-size:11px; margin-right:5px; font-weight:bold;">Approved</span>' : `<button class="btn-approve" onclick="approveCust(${idx})">Approve</button>`}
              <button class="btn-remove" onclick="removeCust(${idx})">Remove</button>
            </div>
          </div>
        `;
      });

      let liveProductsHtml = '';
      products.forEach((p) => {
        liveProductsHtml += `
          <div class="admin-prod-row" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <img src="${p.img}" style="width:50px; height:50px; object-fit:contain; background:#f0f0f0; border-radius:4px;">
            <div style="flex:1; font-size:12px;">
              <b>${p.name}</b><br><span>Rs. ${p.price} | ${p.category}</span>
            </div>
            <button class="btn-remove" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        `;
      });

      let bulkPreviewHtml = '';
      tempBulkImages.forEach((imgObj, idx) => {
        bulkPreviewHtml += `
          <div class="bulk-preview-row">
            <img src="${imgObj.dataUrl}" style="width:100%; height:140px; object-fit:contain; background:#f0f0f0; border-radius:6px; margin-bottom:8px;">
            <input type="text" id="bName_${idx}" class="input-field" placeholder="Product Name" value="${imgObj.name}">
            <select id="bCat_${idx}" class="input-field">
              <option value="Hats" ${imgObj.cat === 'Hats' ? 'selected' : ''}>Hats</option>
              <option value="Turbans" ${imgObj.cat === 'Turbans' ? 'selected' : ''}>Turbans</option>
              <option value="Socks" ${imgObj.cat === 'Socks' ? 'selected' : ''}>Socks</option>
              <option value="Warmer Suits" ${imgObj.cat === 'Warmer Suits' ? 'selected' : ''}>Warmer Suits</option>
              <option value="Mufflers" ${imgObj.cat === 'Mufflers' ? 'selected' : ''}>Mufflers</option>
              <option value="Trousers" ${imgObj.cat === 'Trousers' ? 'selected' : ''}>Trousers</option>
            </select>
            <input type="number" id="bPrice_${idx}" class="input-field" placeholder="Packet Price (Rs)">
            <input type="text" id="bDesc_${idx}" class="input-field" placeholder="Description" value="12 Pcs Packet">
          </div>
        `;
      });

      container.innerHTML = `
        <div class="admin-panel">
          <h2 style="color:#880e4f; margin-bottom:15px;">LV Traders - Admin Panel</h2>
          
          <div class="admin-section">
            <h3>👥 Customer Approvals (${customers.length})</h3>
            ${custHtml || '<p style="font-size:12px; color:#666;">No customers registered yet.</p>'}
          </div>

          <div class="admin-section">
            <h3>📦 Manage Live Store Products (${products.length})</h3>
            ${liveProductsHtml || '<p style="font-size:12px; color:#666;">No products uploaded yet.</p>'}
          </div>

          <div class="admin-section">
            <h3>➕ Bulk Upload Photos from Gallery</h3>
            <input type="file" id="bulkFiles" multiple accept="image/*" class="input-field" style="padding:8px;" onchange="handleBulkFiles(this)">
            
            <div id="bulkFormContainer">
              ${bulkPreviewHtml}
            </div>

            ${tempBulkImages.length > 0 ? '<button class="primary-btn" onclick="publishBulkProducts()">Publish All to Store</button>' : ''}
          </div>

          <button class="primary-btn" onclick="toggleAdminPanel()" style="background:#512da8; margin-top:10px;">← Back to Store</button>
        </div>
      `;
    }

    function handleBulkFiles(input) {
      tempBulkImages = [];
      if (!input.files) return;
      Array.from(input.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          let cleanName = file.name.replace(/^file_[a-z0-9_]+/i, '').replace(/\.[^/.]+$/, "").trim();
          if (!cleanName || cleanName.length < 2) cleanName = "Product Item";

          tempBulkImages.push({
            dataUrl: e.target.result,
            name: cleanName,
            cat: 'Hats'
          });
          renderAdminPanel();
        };
        reader.readAsDataURL(file);
      });
    }

    function publishBulkProducts() {
      if (tempBulkImages.length === 0) return;
      
      tempBulkImages.forEach((imgObj, idx) => {
        const nameInput = document.getElementById(`bName_${idx}`);
        const catInput = document.getElementById(`bCat_${idx}`);
        const priceInput = document.getElementById(`bPrice_${idx}`);
        const descInput = document.getElementById(`bDesc_${idx}`);

        const name = nameInput ? nameInput.value : imgObj.name;
        const category = catInput ? catInput.value : 'Hats';
        const price = priceInput ? Number(priceInput.value) || 0 : 0;
        const desc = descInput ? descInput.value : "12 Pcs Packet";

        products.push({
          id: Date.now() + idx,
          name: name,
          category: category,
          desc: desc,
          price: price,
          qty: 0,
          img: imgObj.dataUrl
        });
      });

      localStorage.setItem('lv_products', JSON.stringify(products));
      tempBulkImages = [];
      alert("All products published successfully!");
      renderAdminPanel();
    }

    function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('lv_products', JSON.stringify(products));
        renderAdminPanel();
      }
    }

    function approveCust(idx) {
      customers[idx].approved = true;
      localStorage.setItem('lv_customers', JSON.stringify(customers));
      renderAdminPanel();
    }

    function removeCust(idx) {
      if (confirm("Remove this customer?")) {
        customers.splice(idx, 1);
        localStorage.setItem('lv_customers', JSON.stringify(customers));
        renderAdminPanel();
      }
    }

    function updateQty(id, change) {
      const item = products.find(p => p.id === id);
      if (item.qty + change >= 0) {
        item.qty += change;
        updateHeaderBill();
        renderApp();
      }
    }

    function updateHeaderBill() {
      let totalBill = 0, totalPkts = 0;
      products.forEach(p => {
        totalBill += p.qty * p.price;
        totalPkts += p.qty;
      });
      const billEl = document.getElementById('totalBill');
      const pktsEl = document.getElementById('totalPkts');
      if (billEl) billEl.innerText = totalBill.toLocaleString();
      if (pktsEl) pktsEl.innerText = totalPkts;
    }

    function filterProducts(cat, btn) {
      currentCategory =
