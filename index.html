<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LV Traders - Wholesale PWA Store</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #15051a; color: #fff; padding-top: 120px; padding-bottom: 75px; }

    .header {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: linear-gradient(135deg, #4a0e4e 0%, #880e4f 50%, #c62828 100%);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .header-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .brand { font-size: 18px; font-weight: 800; letter-spacing: 1px; color: #fff; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .admin-btn {
      background: rgba(0,0,0,0.4); border: 1px solid #ff8a80; color: #fff;
      padding: 5px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
    }
    .bill-box {
      background: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 8px;
      border: 1px solid #ff5252; text-align: right;
    }
    .bill-amount { font-size: 15px; font-weight: bold; color: #ffeb3b; }
    .pkt-count { font-size: 11px; color: #ffcdd2; }

    .categories {
      display: flex; overflow-x: auto; gap: 8px; padding: 10px 14px;
      background: #23062b; scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: #4a148c; color: #fff; border: 1px solid #ad1457;
      padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
      white-space: nowrap; cursor: pointer;
    }
    .cat-btn.active {
      background: linear-gradient(90deg, #d32f2f, #ad1457);
      border-color: #ff8a80; box-shadow: 0 2px 8px rgba(211,47,47,0.6);
    }

    .container { max-width: 500px; margin: 0 auto; padding: 0 10px; }

    .product-item {
      background: #23062b; margin-bottom: 20px; border-radius: 12px;
      overflow: hidden; border: 1px solid #880e4f;
    }
    .product-img {
      width: 100%; height: 62vh; object-fit: contain; display: block; background: #0b020e;
    }
    .product-info { padding: 14px; background: linear-gradient(180deg, #23062b 0%, #15051a 100%); }
    .product-cat {
      display: inline-block; background: #880e4f; color: #ffcdd2;
      font-size: 10px; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; font-weight: bold;
    }
    .product-title { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
    .product-desc { font-size: 13px; color: #d1c4e9; margin-bottom: 12px; }

    .price-cart-row {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.04); padding: 10px 12px; border-radius: 10px;
      border: 1px solid rgba(211,47,47,0.3);
    }
    .price-label { font-size: 11px; color: #f8bbd0; }
    .price-val { font-size: 18px; font-weight: 800; color: #ff5252; }

    .qty-controls { display: flex; align-items: center; gap: 10px; }
    .qty-btn {
      width: 38px; height: 38px; border-radius: 8px; border: none;
      font-size: 20px; font-weight: bold; color: #fff; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-minus { background: #4a148c; border: 1px solid #ab47bc; }
    .btn-plus { background: linear-gradient(135deg, #d32f2f, #ad1457); }
    .qty-display { font-size: 15px; font-weight: bold; min-width: 50px; text-align: center; }

    .bottom-bar {
      position: fixed; bottom: 0; left: 0; width: 100%; padding: 10px 14px;
      background: #1e0524; border-top: 1px solid #880e4f; z-index: 1000; display: flex; gap: 10px;
    }
    .wa-btn {
      flex: 1; background: linear-gradient(90deg, #2e7d32, #1b5e20); color: #fff;
      border: 1px solid #81c784; padding: 12px; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer; text-align: center;
    }

    .admin-panel { background: #1c0524; padding: 15px; border-radius: 12px; margin-top: 10px; }
    .admin-section { background: #270933; padding: 12px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #880e4f; }
    .admin-section h3 { font-size: 15px; color: #ff8a80; margin-bottom: 10px; }
    .user-row, .bulk-preview-row, .admin-prod-row {
      background: #1a0521; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #880e4f;
    }
    .input-field {
      width: 100%; padding: 10px; margin-bottom: 8px; background: #1a0521;
      border: 1px solid #880e4f; color: #fff; border-radius: 6px; font-size: 13px;
    }
    .primary-btn {
      width: 100%; padding: 10px; background: linear-gradient(90deg, #c62828, #6a1b9a);
      border: none; color: #fff; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .btn-approve { background: #2e7d32; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    .btn-remove { background: #c62828; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="brand">LV TRADERS</div>
      <div class="header-actions">
        <button class="admin-btn" onclick="toggleAdminPanel()">⚙️ Admin</button>
      </div>
      <div class="bill-box">
        <div class="bill-amount">Bill: Rs. <span id="totalBill">0</span></div>
        <div class="pkt-count">Cart: <span id="totalPkts">0</span> Pkts</div>
      </div>
    </div>
    <div class="categories" id="categoryBar">
      <button class="cat-btn active" onclick="filterProducts('All', this)">All Items</button>
      <button class="cat-btn" onclick="filterProducts('Hats', this)">Hats</button>
      <button class="cat-btn" onclick="filterProducts('Socks', this)">Socks</button>
      <button class="cat-btn" onclick="filterProducts('Turbans', this)">Turbans</button>
      <button class="cat-btn" onclick="filterProducts('Warmer Suits', this)">Warmer Suits</button>
      <button class="cat-btn" onclick="filterProducts('Mufflers', this)">Mufflers</button>
      <button class="cat-btn" onclick="filterProducts('Trousers', this)">Trousers</button>
    </div>
  </div>

  <div class="container" id="mainContainer"></div>

  <div class="bottom-bar" id="bottomBar">
    <button class="wa-btn" onclick="generatePDFAndWhatsApp()">📲 Send PDF Bill to WhatsApp</button>
  </div>

  <script>
    let isAdminLoggedIn = localStorage.getItem('lv_admin') === 'true';
    
    // Start with empty products so only your uploaded products show up
    let products = JSON.parse(localStorage.getItem('lv_products')) || [];
    let customers = JSON.parse(localStorage.getItem('lv_customers')) || [
      { name: "Ali Garments", shop: "Raja Bazar", phone: "03001234567", approved: true }
    ];

    let currentCategory = 'All';
    let tempBulkImages = [];

    function renderApp() {
      const container = document.getElementById('mainContainer');
      const bottomBar = document.getElementById('bottomBar');
      const headerCategories = document.getElementById('categoryBar');

      if (isAdminLoggedIn) {
        headerCategories.style.display = 'none';
        bottomBar.style.display = 'none';
        renderAdminPanel();
        return;
      }

      headerCategories.style.display = 'flex';
      bottomBar.style.display = 'flex';
      
      let html = '<div class="feed-container">';
      const filtered = currentCategory === 'All' ? products : products.filter(p => p.category === currentCategory);
      
      if (filtered.length === 0) {
        html += '<div style="text-align:center; padding:50px 20px; color:#b39ddb;"><h3 style="margin-bottom:8px;">No Products Live Yet</h3><p style="font-size:13px;">Open Admin Panel (⚙️ Admin) with password <b>admin123</b> to upload products from your gallery.</p></div>';
      }

      filtered.forEach(p => {
        html += `
          <div class="product-item">
            <img src="${p.img}" class="product-img" alt="${p.name}">
            <div class="product-info">
              <span class="product-cat">${p.category}</span>
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.desc}</div>
              <div class="price-cart-row">
                <div>
                  <div class="price-label">Packet Price</div>
                  <div class="price-val">Rs. ${p.price.toLocaleString()}</div>
                </div>
                <div class="qty-controls">
                  <button class="qty-btn btn-minus" onclick="updateQty(${p.id}, -1)">−</button>
                  <div class="qty-display">${p.qty} Pkt</div>
                  <button class="qty-btn btn-plus" onclick="updateQty(${p.id}, 1)">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
      html += '</div>';
      container.innerHTML = html;
      updateHeaderBill();
    }

    function toggleAdminPanel() {
      if (isAdminLoggedIn) {
        isAdminLoggedIn = false;
        localStorage.removeItem('lv_admin');
        renderApp();
      } else {
        let pass = prompt("Enter Admin Password:");
        if (pass === "admin123") {
          isAdminLoggedIn = true;
          localStorage.setItem('lv_admin', 'true');
          renderApp();
        } else if (pass !== null) {
          alert("Incorrect Password! (Default is admin123)");
        }
      }
    }

    function renderAdminPanel() {
      const container = document.getElementById('mainContainer');
      let custHtml = '';
      customers.forEach((c, idx) => {
        custHtml += `
          <div class="user-row" style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${c.name}</b> (${c.shop})<br><small>${c.phone}</small></div>
            <div>
              ${c.approved ? '<span style="color:#81c784; font-size:11px; margin-right:5px;">Approved</span>' : `<button class="btn-approve" onclick="approveCust(${idx})">Approve</button>`}
              <button class="btn-remove" onclick="removeCust(${idx})">Remove</button>
            </div>
          </div>
        `;
      });

      // Existing live products list in admin with Delete option
      let liveProductsHtml = '';
      products.forEach((p, idx) => {
        liveProductsHtml += `
          <div class="admin-prod-row" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
            <img src="${p.img}" style="width:50px; height:50px; object-fit:contain; background:#000; border-radius:4px;">
            <div style="flex:1; font-size:12px;">
              <b>${p.name}</b><br><span>Rs. ${p.price} | ${p.category}</span>
            </div>
            <button class="btn-remove" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        `;
      });

      let bulkPreviewHtml = '';
      tempBulkImages.forEach((imgObj, idx) => {
        bulkPreviewHtml += `
          <div class="bulk-preview-row">
            <img src="${imgObj.dataUrl}" style="width:100%; height:140px; object-fit:contain; background:#000; border-radius:6px; margin-bottom:8px;">
            <input type="text" id="bName_${idx}" class="input-field" placeholder="Product Name" value="${imgObj.name}">
            <select id="bCat_${idx}" class="input-field">
              <option value="Turbans">Turbans</option>
              <option value="Hats">Hats</option>
              <option value="Socks">Socks</option>
              <option value="Warmer Suits">Warmer Suits</option>
              <option value="Mufflers">Mufflers</option>
              <option value="Trousers">Trousers</option>
            </select>
            <input type="number" id="bPrice_${idx}" class="input-field" placeholder="Packet Price (Rs)">
            <input type="text" id="bDesc_${idx}" class="input-field" placeholder="Description (e.g. 12 Pcs Packet)" value="12 Pcs Packet">
          </div>
        `;
      });

      container.innerHTML = `
        <div class="admin-panel">
          <h2 style="color:#ff8a80; margin-bottom:15px;">LV Traders - Admin Panel</h2>
          
          <div class="admin-section">
            <h3>👥 Customer Approvals</h3>
            ${custHtml || '<p>No customers yet.</p>'}
          </div>

          <div class="admin-section">
            <h3>📦 Manage Live Store Products (${products.length})</h3>
            ${liveProductsHtml || '<p style="font-size:12px; color:#b39ddb;">No products uploaded yet.</p>'}
          </div>

          <div class="admin-section">
            <h3>➕ Bulk Upload New Photos from Gallery</h3>
            <input type="file" id="bulkFiles" multiple accept="image/*" class="input-field" style="padding:8px;" onchange="handleBulkFiles(this)">
            
            <div id="bulkFormContainer">
              ${bulkPreviewHtml}
            </div>

            ${tempBulkImages.length > 0 ? '<button class="primary-btn" onclick="publishBulkProducts()">Publish All to Store</button>' : ''}
          </div>

          <button class="primary-btn" onclick="toggleAdminPanel()" style="background:#4a148c; margin-top:10px;">← Back to Store</button>
        </div>
      `;
    }

    function handleBulkFiles(input) {
      tempBulkImages = [];
      if (!input.files) return;
      Array.from(input.files).forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempBulkImages.push({
            dataUrl: e.target.result,
            name: file.name.substring(0, file.name.lastIndexOf('.')) || 'Product'
          });
          renderAdminPanel();
        };
        reader.readAsDataURL(file);
      });
    }

    function publishBulkProducts() {
      if (tempBulkImages.length === 0) return;
      
      tempBulkImages.forEach((imgObj, idx) => {
        const name = document.getElementById(`bName_${idx}`).value || imgObj.name;
        const category = document.getElementById(`bCat_${idx}`).value;
        const price = Number(document.getElementById(`bPrice_${idx}`).value) || 0;
        const desc = document.getElementById(`bDesc_${idx}`).value || "12 Pcs Packet";

        products.push({
          id: Date.now() + idx,
          name: name,
          category: category,
          desc: desc,
          price: price,
          qty: 0,
          img: imgObj.dataUrl
        });
      });

      localStorage.setItem('lv_products', JSON.stringify(products));
      tempBulkImages = [];
      alert("All products published successfully to store!");
      renderAdminPanel();
    }

    function deleteProduct(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('lv_products', JSON.stringify(products));
        renderAdminPanel();
      }
    }

    function approveCust(idx) {
      customers[idx].approved = true;
      localStorage.setItem('lv_customers', JSON.stringify(customers));
      renderAdminPanel();
    }

    function removeCust(idx) {
      customers.splice(idx, 1);
      localStorage.setItem('lv_customers', JSON.stringify(customers));
      renderAdminPanel();
    }

    function updateQty(id, change) {
      const item = products.find(p => p.id === id);
      if (item.qty + change >= 0) {
        item.qty += change;
        updateHeaderBill();
        renderApp();
      }
    }

    function updateHeaderBill() {
      let totalBill = 0, totalPkts = 0;
      products.forEach(p => {
        totalBill += p.qty * p.price;
        totalPkts += p.qty;
      });
      document.getElementById('totalBill').innerText = totalBill.toLocaleString();
      document.getElementById('totalPkts').innerText = totalPkts;
    }

    function filterProducts(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function generatePDFAndWhatsApp() {
      const selected = products.filter(p => p.qty > 0);
      if (!selected.length) { alert("Please add at least 1 packet to your cart!"); return; }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFont("helvetica", "bold");
      doc.setFontSize(18);
      doc.setTextColor(74, 14, 78);
      doc.text("LV TRADERS - WHOLESALE ORDER", 14, 20);

      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 14, 27);

      let y = 35;
      let totalAmount = 0;

      selected.forEach((p, index) => {
        if (y > 250) { doc.addPage(); y = 20; }
        let subtotal = p.qty * p.price;
        totalAmount += subtotal;

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);
        doc.setTextColor(0, 0, 0);
        doc.text(`${index + 1}. ${p.name}`, 14, y);

        doc.setFont("helvetica", "normal");
        doc.setFontSize(9);
        doc.text(`Category: ${p.category} | ${p.desc}`, 14, y + 5);
        doc.text(`Ordered: ${p.qty} Pkts x Rs. ${p.price.toLocaleString()} = Rs. ${subtotal.toLocaleString()}`, 14, y + 10);

        try {
          doc.addImage(p.img, 'JPEG', 150, y - 2, 22, 22);
        } catch(e) {}

        doc.setDrawColor(200, 200, 200);
        doc.line(14, y + 15, 196, y + 15);
        y += 22;
      });

      y += 5;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(13);
      doc.setTextColor(198, 40, 40);
      doc.text(`TOTAL BILL: Rs. ${totalAmount.toLocaleString()}`, 14, y);

      doc.save("LV_Traders_Order.pdf");

      let msg = `*LV TRADERS - NEW WHOLESALE ORDER*%0A------------------------%0A`;
      selected.forEach((p, i) => {
        msg += `${i+1}. ${p.name} - ${p.qty} Pkts (Rs.${p.qty * p.price})%0A`;
      });
      msg += `------------------------%0A*TOTAL: Rs. ${totalAmount.toLocaleString()}*%0A*(PDF Bill downloaded on device)*`;
      window.open(`https://wa.me/?text=${msg}`, '_blank');
    }

    renderApp();
  </script>
</body>
</html>
