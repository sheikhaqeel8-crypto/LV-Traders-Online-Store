<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LV Traders - Wholesale Store</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f4f6f9;color:#333;padding-top:115px;padding-bottom:80px}
.header{position:fixed;top:0;left:0;width:100%;z-index:1000;background:linear-gradient(135deg,#4a0e4e 0%,#880e4f 50%,#c62828 100%);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.header-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.15)}
.brand{font-size:18px;font-weight:800;color:#fff;letter-spacing:.5px}
.header-actions{display:flex;gap:6px;align-items:center}
.top-btn{background:rgba(0,0,0,.35);border:1px solid #ff8a80;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.bill-box{background:rgba(0,0,0,.35);padding:4px 10px;border-radius:8px;border:1px solid #ff5252;text-align:right}
.bill-amount{font-size:14px;font-weight:bold;color:#ffeb3b}
.pkt-count{font-size:11px;color:#ffcdd2}
.categories{display:none;overflow-x:auto;gap:8px;padding:10px 14px;background:#380b3d;scrollbar-width:none}
.categories::-webkit-scrollbar{display:none}
.cat-btn{background:#512da8;color:#fff;border:1px solid #ad1457;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.cat-btn.active{background:linear-gradient(90deg,#d32f2f,#ad1457);border-color:#ff8a80}
.container{max-width:500px;margin:0 auto;padding:0 12px}
.card-box{background:#fff;border:2px solid #880e4f;padding:22px;border-radius:16px;margin-top:20px;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.card-box h2{color:#880e4f;margin-bottom:8px;font-size:20px}
.card-box p{font-size:13px;color:#555;margin-bottom:18px;line-height:1.6}
.input-field{width:100%;padding:12px;margin-bottom:12px;background:#fff;border:1px solid #bbb;color:#222;border-radius:8px;font-size:14px}
.primary-btn{width:100%;padding:13px;background:linear-gradient(90deg,#c62828,#6a1b9a);border:none;color:#fff;font-weight:bold;border-radius:8px;cursor:pointer;font-size:15px;margin-top:6px}
.primary-btn:disabled{opacity:.6}
.wa-green-btn{background:linear-gradient(90deg,#2e7d32,#1b5e20)}
.product-item{background:#fff;margin-bottom:18px;border-radius:12px;overflow:hidden;border:1px solid #ddd;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.product-img{width:100%;height:55vh;object-fit:contain;display:block;background:#f8f8f8}
.product-info{padding:14px}
.product-cat{display:inline-block;background:#fce4ec;color:#880e4f;font-size:11px;padding:3px 8px;border-radius:4px;margin-bottom:4px;font-weight:bold}
.product-title{font-size:18px;font-weight:700;color:#111;margin-bottom:2px}
.product-desc{font-size:13px;color:#666;margin-bottom:12px}
.price-cart-row{display:flex;justify-content:space-between;align-items:center;background:#fdf2f2;padding:10px 12px;border-radius:10px;border:1px solid #ffcdd2}
.price-label{font-size:11px;color:#d32f2f}
.price-val{font-size:18px;font-weight:800;color:#c62828}
.qty-controls{display:flex;align-items:center;gap:10px}
.qty-btn{width:38px;height:38px;border-radius:8px;border:none;font-size:20px;font-weight:bold;color:#fff;cursor:pointer}
.btn-minus{background:#6a1b9a}.btn-plus{background:#d32f2f}
.qty-display{font-size:15px;font-weight:bold;min-width:50px;text-align:center;color:#222}
.bottom-bar{position:fixed;bottom:0;left:0;width:100%;padding:10px 14px;background:#fff;border-top:1px solid #ccc;z-index:1000;display:none;box-shadow:0 -4px 10px rgba(0,0,0,.05)}
.wa-order-btn{width:100%;background:linear-gradient(90deg,#2e7d32,#1b5e20);color:#fff;border:none;padding:13px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
.admin-section{background:#fff;padding:14px;border-radius:10px;margin-bottom:15px;border:1px solid #ddd;text-align:left}
.admin-section h3{font-size:15px;color:#880e4f;margin-bottom:10px}
.row-item{background:#f9f9f9;padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid #eee}
.sm-btn{border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-size:11px;color:#fff;font-weight:bold}
.sync-badge{font-size:11px;color:#81c784;display:block;margin-top:2px;font-weight:bold}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#eee}
.flex{display:flex;gap:8px;align-items:center}
.mini{padding:8px;margin-bottom:6px;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="brand">LV TRADERS</div>
      <span id="syncStatus" class="sync-badge">● Ready</span>
    </div>
    <div class="header-actions">
      <button type="button" class="top-btn" onclick="showAdminLoginBox()">
